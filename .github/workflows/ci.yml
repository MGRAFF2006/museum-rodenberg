name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run test:node

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  push-convex-schema:
    name: Push Convex Schema to Sevalla
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    concurrency:
      group: convex-production-schema
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check deployment credentials
        id: deployment
        env:
          CONVEX_PROD_URL: ${{ secrets.CONVEX_PROD_URL }}
          CONVEX_PROD_ADMIN_KEY: ${{ secrets.CONVEX_PROD_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${CONVEX_PROD_URL:-}" && -n "${CONVEX_PROD_ADMIN_KEY:-}" ]]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            echo "Skipping schema deployment: production credentials are not configured."
          fi
      - uses: actions/checkout@v4
        if: steps.deployment.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.deployment.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.deployment.outputs.enabled == 'true'
      - name: Push schema to Sevalla Convex backend
        if: steps.deployment.outputs.enabled == 'true'
        env:
          CONVEX_PROD_URL: ${{ secrets.CONVEX_PROD_URL }}
          CONVEX_PROD_ADMIN_KEY: ${{ secrets.CONVEX_PROD_ADMIN_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping outdated schema deployment: main has moved."
            exit 0
          fi
          bash scripts/push-convex.sh --prod
